<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZEGAAR AMMAR GLASS MANAGER</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00bfff">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { background: #060e1c; color: white; padding: 20px; font-family: Arial; }
        .box { border: 2px solid #00bfff; padding: 20px; border-radius: 15px; background: #0b1a33; margin-bottom: 20px; }
        input, button { padding: 12px; width: 100%; margin-bottom: 10px; border-radius: 5px; border: none; }
        button { background: #00bfff; color: #060e1c; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="box">
    <input type="text" id="phone-name" placeholder="ابحث عن اسم الهاتف...">
    <button onclick="searchPhone()">بحث</button>
</div>

<div id="results" class="box"></div>

<script>
    // إعداد Supabase (ضع مفاتيحك هنا)
    const supabase = supabase.createClient('YOUR_SUPABASE_URL', 'YOUR_SUPABASE_KEY');

    async function searchPhone() {
        const name = document.getElementById('phone-name').value;
        const resDiv = document.getElementById('results');
        
        // استعلام ذكي من Supabase
        const { data, error } = await supabase
            .from('glass_models')
            .select('*')
            .ilike('model_name', `%${name}%`);

        if (data && data.length > 0) {
            resDiv.innerHTML = `<h3>نتائج البحث:</h3><ul>${data.map(i => `<li>${i.model_name} - قياس: ${i.size}</li>`).join('')}</ul>`;
        } else {
            resDiv.innerHTML = `<p>⚠️ الموديل غير موجود. <button onclick="alert('خطة الطوارئ!')">إضافة يدوي</button></p>`;
        }
    }

    // تسجيل الـ Service Worker للتثبيت
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('service-worker.js');
    }
</script>
</body>
</html>
