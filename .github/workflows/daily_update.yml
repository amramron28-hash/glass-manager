name: Auto Update Database
on:
  schedule:
    - cron: '0 0 * * *' # سيعمل التحديث تلقائياً مرة واحدة يومياً
  workflow_dispatch:     # للسماح لك بتشغيله يدوياً من GitHub في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests

      - name: Run Watcher
        run: python glass_watcher.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add models_db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update DB via Watcher" && git push)
