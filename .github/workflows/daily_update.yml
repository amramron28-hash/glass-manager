name: Auto Update Database

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # إضافة متغير البيئة هنا لفرض العمل على Node.js 24
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          pip install requests fuzzywuzzy python-Levenshtein
      - name: Run watcher
        run: python glass_watcher.py
      - name: Commit and Push
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add models_db.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update DB" && git push)
