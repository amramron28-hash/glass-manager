name: Sync to Hugging Face

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install Hugging Face Hub
        run: pip install huggingface_hub

      - name: Upload Entire Repository
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os

          api = HfApi(token=os.environ['HF_TOKEN'])

          # رفع كل محتويات المستودع بما فيها مجلد الصور بشكل آمن ومباشر
          api.upload_folder(
              folder_path='.',
              repo_id='amramron28/zegaarmour-glass-manager',
              repo_type='space',
              ignore_patterns=['.git/', '.github/']
          )
          print('تم رفع جميع الملفات والمجلدات بنجاح')
          "
