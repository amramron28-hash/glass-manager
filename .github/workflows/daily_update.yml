name: Sync to Hugging Face
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git lfs install
          # تحويل تتبع الملفات بأثر رجعي
          git rm --cached *.webp || true
          git lfs track "*.webp"
          git add .gitattributes
          git add *.webp || true
          git commit -m "Force track webp files with LFS" || true
          git push --force https://amramron28-hash:$HF_TOKEN@huggingface.co/spaces/amramron28/Zegaarammar main
